packages:
  - apps/*
  - packages/*

# Playwright compiles no native code here; approving it explicitly keeps a
# fresh `pnpm install` from stopping to ask.
allowBuilds:
  esbuild: false

# Patch the source-map parser used by the CSS build chain (GHSA-68fv-2mgg-jv7q).
overrides:
  source-map-js: 1.2.2
