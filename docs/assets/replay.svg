<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">The Aegis Relay investigation loop</title><desc id="d">Rebuild the observed relationships, inspect a composed route, and verify a registered response without interrupting declared work.</desc><rect width="1200" height="360" rx="16" fill="#f0f1e8"/><g fill="#183d32" font-family="Georgia,serif" font-size="30"><text x="34" y="69">01 / Trace</text><text x="435" y="69">02 / Compare</text><text x="830" y="69">03 / Verify</text></g><path d="M400 30v300M796 30v300" stroke="#c5d0bf"/><g fill="none" stroke="#456b56" stroke-width="2"><path d="M70 180h80l60-45 85 45M150 180l60 55 85-55"/><path d="M465 180h100l65-45 105 45M565 180l65 55 105-55"/><path d="M860 180h100l65-45 105 45"/></g><path d="m565 180 65 55 105-55" fill="none" stroke="#ba493b" stroke-width="3" stroke-dasharray="7 5"/><path d="m960 180 65 55 105-55" fill="none" stroke="#ad681e" stroke-width="2" stroke-dasharray="2 6" opacity=".55"/><g fill="#f7f6f2" stroke="#456b56" stroke-width="2"><circle cx="70" cy="180" r="12"/><circle cx="150" cy="180" r="12"/><circle cx="295" cy="180" r="12"/><circle cx="465" cy="180" r="12"/><circle cx="565" cy="180" r="12"/><circle cx="735" cy="180" r="12"/><circle cx="860" cy="180" r="12"/><circle cx="960" cy="180" r="12"/><circle cx="1130" cy="180" r="12"/></g><g fill="#183d32"><rect x="196" y="121" width="28" height="28" rx="6"/><rect x="196" y="221" width="28" height="28" rx="6"/><rect x="616" y="121" width="28" height="28" rx="6"/><rect x="1011" y="121" width="28" height="28" rx="6"/></g><rect x="616" y="221" width="28" height="28" rx="6" fill="#ba493b"/><path d="m1015 225 20 20m0-20-20 20" stroke="#ad681e" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="15" fill="#53685d"><text x="34" y="294">Reconstruct the reported interactions.</text><text x="435" y="294">Inspect the route the design did not declare.</text><text x="830" y="294">Check the path and the work that remains.</text></g><text x="34" y="331" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#607369">CONCEPTUAL PROCESS ILLUSTRATION / ENGINE OUTPUT IS AVAILABLE IN THE WORKSPACE</text></svg>
