<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Aegis Relay / Investigation plates</title><style>*{box-sizing:border-box}body{margin:0;background:#dde4d8;color:#183d32;font-family:Arial,sans-serif}.card{width:1500px;height:1000px;background:#f7f6f2;padding:48px;display:grid;grid-template-columns:310px 1fr;gap:36px;position:relative;border-bottom:1px solid #c8d3c8}.rail{display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:12px;align-items:center;font:25px Georgia,serif}.brand img{width:40px}.no{font-size:11px;letter-spacing:2px;color:#607369;margin-top:30px}h1{font:42px/1.1 Georgia,serif;letter-spacing:-1px;font-weight:400;margin:0}p{font-size:15px;line-height:1.8;color:#52665d;margin:0}.tag{font-size:10px;letter-spacing:1px;margin-top:auto;line-height:1.7;border-top:1px solid #c8d3c8;padding-top:18px}.shot{display:flex;align-items:center;justify-content:center;background:#e8eddf;border:1px solid #c8d3c8;border-radius:16px;overflow:hidden;padding:20px}.shot img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 26px #183d3214}</style></head><body><div id="cards"></div><script>
const plates=[
['00-hero.png','An investigation, one handoff at a time.','Choose a case, replay the observations and follow the engine’s conclusions.'],
['01-baseline.png','Begin with the declared system.','The map distinguishes the architecture’s permitted relationships from the interactions observed so far.'],
['02-detected.png','A route becomes visible.','The final read connects individually permitted actions into the path reported by PS-001.'],
['04-finding.png','Keep the claim inspectable.','A finding names its rule, policy basis and uncertainty alongside the reported evidence.'],
['05-signals.png','Read the factors behind the score.','Weights stay visible, including factors that did not fire. The console presents the engine’s calculation.'],
['03-containment.png','Compare the responses.','Every registered candidate remains visible. Removing the path is insufficient if a control also breaks declared work.'],
['07-verified.png','Verify what remains.','The engine checks the resulting graph after the simulated response is applied.'],
['06-contained.png','A narrower interruption.','Action-scoped containment removes the selected relationship while leaving other observed actions intact.'],
['08-immunity.png','Store a draft for review.','A structural pattern is a reviewable hypothesis. Its lifecycle requires explicit operator promotion.'],
['09-lab.png','Change the conditions.','The population experiment runs the same rules and response planner as the replay.'],
['11-individual-vs-population.png','Look beyond a single actor.','The field guide illustrates how separate permissions can assemble a capability across a network.'],
['12-not-prompt-injection.png','Add a system view.','Relationship analysis complements controls around models, identities, prompts, tools and data.'],
['13-behavior-graph.png','Explore the handoff map.','The field guide’s inspectable graph makes the structure concrete without claiming a measured deployment.'],
['14-research.png','Read around the problem.','Independent work frames the research questions; it does not endorse this implementation.'],
['10-overview-hero.png','Follow the handoff. Find the risk.','A new visual identity built around routes, boundaries and the work a response should preserve.']];
document.querySelector('#cards').innerHTML=plates.map(([img,title,body],i)=>`<article class="card" id="g${String(i+1).padStart(2,'0')}"><div class="rail"><div class="brand"><img src="../../brand/emblem.svg" alt="">Aegis Relay</div><div class="no">PLATE / ${String(i+1).padStart(2,'0')}</div><h1>${title}</h1><p>${body}</p><div class="tag">${i<10?'ENGINE OUTPUT / FICTIONAL ENVIRONMENT':'FIELD GUIDE / CONCEPTUAL ILLUSTRATION'}<br>Understand the system. Preserve the work.</div></div><div class="shot"><img src="../${img}" alt=""></div></article>`).join('');
</script></body></html>
