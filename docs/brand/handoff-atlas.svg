<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">The handoff atlas</title><desc id="desc">A conceptual route passes through a data source, a support agent, shared memory and a reporting agent. A response gate interrupts the undeclared handoff before the external boundary.</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#d2dccf" stroke-width=".5"/></pattern><marker id="arr" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#456b56" stroke-width="1.2"/></marker></defs><rect width="720" height="650" rx="20" fill="#e8eddf"/><rect x="20" y="20" width="680" height="610" rx="12" fill="url(#grid)"/><g fill="none" stroke="#bcccb9"><ellipse cx="371" cy="320" rx="246" ry="228"/><ellipse cx="371" cy="320" rx="198" ry="182"/><ellipse cx="371" cy="320" rx="144" ry="132"/><path d="M37 320h645M371 54v532" stroke-dasharray="3 9"/></g><g font-family="Arial,sans-serif" fill="#5c7462" font-size="10" letter-spacing="2"><text x="45" y="55">RELATIONSHIP STUDY / 01</text><text x="45" y="602">A DECLARATION IS A BASELINE.</text><text x="45" y="619">A CONNECTION CAN CHANGE IT.</text><text x="605" y="55">AR / 001</text></g><path d="M165 190C165 260 270 205 300 291M300 332C300 400 436 430 506 372M543 321C625 267 633 229 633 163" fill="none" stroke="#456b56" stroke-width="2" marker-end="url(#arr)"/><path d="M182 190C342 136 474 181 504 306" fill="none" stroke="#b76043" stroke-width="2.5" stroke-dasharray="8 6"/><g fill="#f8f7ef" stroke="#456b56" stroke-width="1.5"><rect x="93" y="131" width="147" height="77" rx="10"/><rect x="238" y="276" width="141" height="72" rx="10"/><rect x="454" y="301" width="144" height="77" rx="10"/><rect x="581" y="96" width="102" height="67" rx="10"/></g><g fill="#183d32" font-family="Arial,sans-serif"><text x="111" y="154" font-size="10" letter-spacing="1.5">DATA SOURCE</text><text x="111" y="178" font-size="18">Customer</text><text x="111" y="197" font-size="18">records</text><text x="256" y="299" font-size="10" letter-spacing="1.5">AGENT 01</text><text x="256" y="326" font-size="19">Support</text><text x="472" y="325" font-size="10" letter-spacing="1.5">AGENT 02</text><text x="472" y="353" font-size="19">Reporting</text><text x="595" y="120" font-size="9" letter-spacing="1.3">BOUNDARY</text><text x="595" y="143" font-size="15">External</text></g><g transform="translate(391 188)"><circle r="50" fill="#f8f2e3" stroke="#b76043" stroke-width="1.4"/><circle r="41" fill="none" stroke="#dcb89b" stroke-dasharray="2 5"/><path d="M-14-7h28M-14 0h28M-14 7h28" stroke="#b76043" stroke-width="2"/><text y="73" text-anchor="middle" fill="#8b4c32" font-size="11" font-family="Arial,sans-serif" letter-spacing="1">SHARED MEMORY</text><text y="89" text-anchor="middle" fill="#8b4c32" font-size="10" font-family="Arial,sans-serif">outside the declaration</text></g><g transform="translate(401 421)"><rect x="-78" y="-20" width="156" height="40" rx="20" fill="#183d32"/><path d="M-54-8V8M-46-8V8" stroke="#e5b376" stroke-width="2"/><text x="-30" y="4" font-family="Arial,sans-serif" fill="#f0f3e5" font-size="11">Response gate</text></g><g fill="#456b56" font-family="Arial,sans-serif" font-size="11"><text x="176" y="263">permitted read</text><text x="421" y="453">registered intervention</text><text x="577" y="250" transform="rotate(-57 577 250)">permitted send</text></g><circle cx="371" cy="320" r="5" fill="#183d32"/><path d="M358 320h26M371 307v26" stroke="#183d32" stroke-width="1"/><g transform="translate(593 521)"><circle r="39" fill="none" stroke="#aebfa8"/><path d="M0-27V27M-27 0H27" stroke="#aebfa8"/><text y="-44" text-anchor="middle" font-size="10" fill="#5c7462" font-family="Arial,sans-serif">N</text><path d="m0-19 5 19H-5Z" fill="#456b56"/></g></svg>
