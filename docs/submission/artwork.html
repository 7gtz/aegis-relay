<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aegis Relay submission artwork</title>
    <link rel="stylesheet" href="../../apps/site/assets/fonts/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #111e19;
        color: #f3f4e9;
        font-family: "DM Sans", sans-serif;
      }
      body {
        width: 1200px;
        height: 800px;
        overflow: hidden;
        position: relative;
        padding: 64px 70px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 68px;
        letter-spacing: -3px;
        font-weight: 500;
      }
      .brand img {
        width: 76px;
        height: 76px;
      }
      .brand em {
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        letter-spacing: 3px;
        color: #b8d8a8;
        margin-top: 35px;
      }
      h1 {
        font-family: "DM Serif Display", Georgia, serif;
        font-weight: 400;
        font-size: 71px;
        letter-spacing: -1.7px;
        line-height: 1.1;
        position: relative;
        z-index: 2;
        margin: 37px 0 20px;
        max-width: 660px;
      }
      h1 em {
        color: #b8d8a8;
        font-weight: 400;
      }
      .desc {
        font-size: 24px;
        color: #c6d2c5;
        line-height: 1.55;
        max-width: 480px;
        position: relative;
        z-index: 2;
      }
      .art {
        position: absolute;
        width: 580px;
        height: 570px;
        right: -24px;
        top: 196px;
      }
      .foot {
        position: absolute;
        bottom: 49px;
        left: 70px;
        right: 70px;
        padding-top: 22px;
        border-top: 1px solid #3a5043;
        display: flex;
        gap: 30px;
        align-items: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 1px;
        color: #b8c9b4;
      }
      .foot span:last-child {
        margin-left: auto;
        color: #92a58f;
      }
      .cover {
        width: 1920px;
        height: 1080px;
        padding: 90px 100px;
      }
      .cover .brand {
        font-size: 92px;
        gap: 26px;
      }
      .cover .brand img {
        width: 96px;
        height: 96px;
      }
      .cover .eyebrow {
        font-size: 20px;
        margin-top: 54px;
      }
      .cover h1 {
        font-size: 108px;
        max-width: 1000px;
        margin-top: 52px;
      }
      .cover .desc {
        font-size: 32px;
        max-width: 760px;
      }
      .cover .art {
        width: 830px;
        height: 820px;
        right: 24px;
        top: 220px;
      }
      .cover .foot {
        left: 100px;
        right: 100px;
        bottom: 68px;
        font-size: 18px;
        padding-top: 30px;
      }
      .social {
        height: 630px;
        padding: 43px 60px;
      }
      .social .brand {
        font-size: 62px;
      }
      .social .brand img {
        width: 62px;
        height: 62px;
      }
      .social .eyebrow {
        font-size: 13px;
        margin-top: 25px;
      }
      .social h1 {
        font-size: 62px;
        margin-top: 24px;
      }
      .social .desc {
        font-size: 21px;
      }
      .social .art {
        width: 490px;
        height: 480px;
        top: 125px;
        right: 0;
      }
      .social .foot {
        left: 60px;
        right: 60px;
        bottom: 31px;
        font-size: 11px;
        padding-top: 17px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../brand/emblem.svg" alt="" />Aegis <em>Relay</em>
    </div>
    <div class="eyebrow">AGENT-SYSTEM SECURITY</div>
    <h1>Follow the handoff.<br /><em>Find the risk.</em></h1>
    <p class="desc">
      Trace the connection.<br />Compare the response.<br />Preserve the work.
    </p>
    <svg
      class="art"
      viewBox="0 0 580 570"
      role="img"
      aria-label="A conceptual handoff route with a response gate"
    >
      <defs>
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M30 0H0V30" fill="none" stroke="#31483b" stroke-width=".6" />
        </pattern>
      </defs>
      <rect x="40" y="25" width="500" height="490" rx="250" fill="url(#grid)" />
      <g fill="none" stroke="#354d3c">
        <ellipse cx="300" cy="285" rx="222" ry="210" />
        <ellipse cx="300" cy="285" rx="165" ry="157" />
        <ellipse cx="300" cy="285" rx="108" ry="102" />
      </g>
      <g fill="none" stroke="#6d8c70" stroke-width="2">
        <path d="M140 160C160 270 250 130 295 280S440 420 465 350" />
        <path d="M140 160C315 55 470 150 465 350" />
        <path d="M295 280C210 365 185 401 155 440" />
        <path d="M295 280C402 256 414 175 458 148" />
      </g>
      <path
        d="M140 160C160 270 250 130 295 280S440 420 465 350"
        fill="none"
        stroke="#e5b376"
        stroke-width="5"
      />
      <g fill="#183d32" stroke="#b8d8a8" stroke-width="2">
        <circle cx="140" cy="160" r="27" />
        <circle cx="465" cy="350" r="27" />
        <path d="m295 243 37 37-37 37-37-37Z" />
        <rect x="137" y="422" width="36" height="36" rx="3" />
        <rect x="440" y="130" width="36" height="36" rx="3" />
      </g>
      <g fill="#eaf0df">
        <circle cx="140" cy="160" r="7" />
        <circle cx="465" cy="350" r="7" />
        <circle cx="295" cy="280" r="6" />
      </g>
      <g transform="translate(366 385)">
        <circle r="35" fill="#111e19" stroke="#e5b376" stroke-width="2" />
        <path
          d="M-7-12V12M7-12V12"
          stroke="#e5b376"
          stroke-width="4"
          stroke-linecap="round"
        />
      </g>
      <g
        font-family="IBM Plex Mono,monospace"
        font-size="12"
        letter-spacing="1.5"
        fill="#a6b9a2"
      >
        <text x="105" y="116">ACTOR 01</text>
        <text x="426" y="403">ACTOR 02</text>
        <text x="236" y="225">SHARED STATE</text>
        <text x="309" y="449" fill="#e5b376">RESPONSE GATE</text>
      </g>
    </svg>
    <div class="foot">
      <span>INSPECT</span><span>COMPARE</span><span>VERIFY</span
      ><span>FICTIONAL DATA · SIMULATED CONTROLS</span>
    </div>
    <script>
      const variant = new URLSearchParams(location.search).get("variant");
      if (variant === "cover" || variant === "social")
        document.body.classList.add(variant);
    </script>
  </body>
</html>
